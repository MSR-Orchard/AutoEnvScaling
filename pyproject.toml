[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autoenvscaling"
version = "0.1.0"
description = "AutoEnvScaling: a proposer agent builds, validates, and calibrates the RL environments a terminal agent trains on."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "harbor[modal]==0.23.0",
  "modal>=1.6",
  "httpx>=0.28,<1",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
carry = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "transformers>=4.45"]   # the recording proxy
analysis = ["matplotlib>=3.8", "seaborn>=0.13", "numpy>=1.26", "pandas>=2.2", "scipy>=1.11"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24", "ruff>=0.12,<1"]

[project.scripts]
autoenvscaling = "autoenvscaling.cli:main"
aes = "autoenvscaling.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["autoenvscaling"]

[tool.hatch.build.targets.wheel.force-include]
"rubrics" = "autoenvscaling/rubrics"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: needs real credentials (Modal, model endpoints); skipped unless AES_LIVE_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
